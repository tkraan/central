
## alpha release
## Create new tagged release if CI running on main else we are not releasing a new version so skipping this step
release:tag:
  # image: harbor.containers.wurnet.nl/proxy-cache/library/node:14-buster-slim
  image: harbor.containers.wurnet.nl/proxy-cache/library/node:latest
  stage: release
  extends:
    - .base
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git-core ca-certificates
    - npm install -g semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/gitlab @semantic-release/git @semantic-release/npm @semantic-release/release-notes-generator @amille/semantic-release-plugins conventional-changelog conventional-changelog-conventionalcommits
  script:
    - semantic-release
  needs:
    - job: 'validate:lint'
    - job: 'validate:defaults:kubeval'
    - job: 'validate:defaults:kubescore'
  #  - job: 'release:documentation'
  only:
    - main

## publish release on creation of new tag
release:publish:public:
  stage: publish
  before_script:
    - apk add git
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm repo update
    - helm dependency build
    - yq -i '.version = "'$CI_COMMIT_TAG'"' Chart.yaml
    - helm package .
  script:
    - helm registry login $HARBOR_REGISTRY -u $HARBOR_USER -p $HARBOR_PASSWORD
    - helm push *.tgz oci://$HARBOR_REGISTRY/$HARBOR_PROJECT
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG =~ /^*.*.*/
      
